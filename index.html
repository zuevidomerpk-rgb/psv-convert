<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PSV Convert</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap');
    body { font-family: "Inter", sans-serif; -webkit-tap-highlight-color: transparent; }

    .card {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(226,232,240,0.9);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(15,23,42,0.05);
      backdrop-filter: blur(8px);
    }

    .pill {
      border-radius: 14px;
      border: 2px solid rgba(226,232,240,0.85);
      background: rgba(255,255,255,0.75);
      transition: 0.18s ease;
      cursor: pointer;
      user-select: none;
    }
    .pill:hover { border-color: rgba(37,99,235,0.4); transform: translateY(-1px); }
    .pill.active {
      border-color: rgb(37 99 235);
      background: rgba(37,99,235,0.06);
      box-shadow: 0 12px 28px rgba(37,99,235,0.10);
    }

    .seg {
      background: rgb(241 245 249);
      border-radius: 16px;
      padding: 6px;
      display: flex;
      gap: 6px;
    }
    .seg button {
      flex: 1;
      border-radius: 12px;
      font-weight: 900;
      font-size: 12px;
      padding: 10px 8px;
      transition: 0.18s ease;
    }
    .seg button.active {
      background: white;
      border: 1px solid rgba(226,232,240,0.95);
      box-shadow: 0 8px 18px rgba(15,23,42,0.06);
      color: rgb(15 23 42);
    }
    .seg button.inactive {
      color: rgb(100 116 139);
    }
    .seg button.inactive:hover { color: rgb(15 23 42); }

    #drop-zone {
      border: 2px dashed rgba(148,163,184,0.85);
      background: rgba(248,250,252,0.85);
      transition: 0.2s ease;
      border-radius: 16px;
    }
    #drop-zone.drag-over {
      border-color: rgb(37 99 235);
      background: rgba(37,99,235,0.08);
      transform: scale(1.01);
      box-shadow: 0 20px 60px rgba(37,99,235,0.18);
    }

    .btn-main {
      border-radius: 18px;
      font-weight: 900;
      letter-spacing: 0.05em;
      transition: 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-main::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(255,255,255,0.25), transparent 60%);
      opacity: 0;
      transition: 0.25s ease;
    }
    .btn-main:hover::after { opacity: 1; }

    .toast {
      border-radius: 16px;
      padding: 12px 14px;
      font-weight: 900;
      font-size: 13px;
      box-shadow: 0 12px 30px rgba(15,23,42,0.08);
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .mini-btn {
      font-weight: 900;
      font-size: 11px;
      padding: 7px 10px;
      border-radius: 12px;
      transition: 0.15s ease;
      user-select: none;
      white-space: nowrap;
    }
    .mini-btn:active { transform: scale(0.96); }
  </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-3">

  <div class="fixed -top-40 -left-40 w-[520px] h-[520px] bg-blue-200/35 rounded-full blur-3xl"></div>
  <div class="fixed top-32 -right-40 w-[520px] h-[520px] bg-orange-200/25 rounded-full blur-3xl"></div>

  <main class="relative max-w-xl w-full space-y-3">

    <header class="text-center py-1">
      <h1 class="text-3xl font-black italic text-slate-900 tracking-tight flex items-center justify-center gap-2">
        PSV <span class="text-blue-600">Convert</span>
        <span class="text-[10px] font-black not-italic px-2 py-1 rounded-xl bg-slate-200 text-slate-600 tracking-widest">
          v1.5
        </span>
      </h1>
    </header>

    <!-- FILE -->
    <section class="card">
      <div class="flex items-center justify-between mb-2">
        <div class="font-black text-slate-900">Файлы</div>
        <div id="file-count" class="text-xs font-black text-slate-400">0</div>
      </div>

      <div id="drop-zone" class="p-4 text-center cursor-pointer select-none">
        <input id="file-input" type="file" class="hidden" multiple>

        <div class="flex items-center justify-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" d="M12 4v16m8-8H4"/>
            </svg>
          </div>
          <div class="text-left leading-tight">
            <div class="text-slate-900 font-black text-sm">Выбрать PSV</div>
            <div class="text-slate-400 font-bold text-xs">или перетащить сюда</div>
          </div>
        </div>
      </div>

      <div id="file-list" class="mt-3 hidden"></div>

      <div class="mt-2 flex justify-end">
        <button id="clear-files" class="hidden text-[10px] font-black uppercase tracking-widest text-red-500 px-3 py-2 rounded-xl hover:bg-red-50 transition">
          Очистить
        </button>
      </div>
    </section>

    <!-- FORMAT + SETTINGS -->
    <section class="card">
      <div class="grid grid-cols-2 gap-2">
        <div class="pill active p-3 flex items-center gap-3" data-type="format" data-value="kml">
          <div class="w-10 h-10 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            </svg>
          </div>
          <div class="leading-tight">
            <div class="font-black text-slate-900 text-sm">KML</div>
            <div class="text-[10px] font-black uppercase tracking-widest text-slate-400">Track + Marks</div>
          </div>
        </div>

        <div class="pill p-3 flex items-center gap-3" data-type="format" data-value="gpx">
          <div class="w-10 h-10 rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3"/>
            </svg>
          </div>
          <div class="leading-tight">
            <div class="font-black text-slate-900 text-sm">GPX</div>
            <div class="text-[10px] font-black uppercase tracking-widest text-slate-400">Navigation</div>
          </div>
        </div>
      </div>

      <div id="kml-settings" class="mt-3 space-y-2">
        <div class="seg">
          <button class="active" data-type="interval-mode" data-value="none">Без меток</button>
          <button class="inactive" data-type="interval-mode" data-value="distance">Расстояние</button>
          <button class="inactive" data-type="interval-mode" data-value="time">Время</button>
        </div>

        <div id="interval-block" class="hidden">
          <div id="interval-grid" class="grid grid-cols-4 gap-2 mt-2"></div>
        </div>
      </div>
    </section>

    <!-- ACTION -->
    <section class="card">
      <button id="convert-btn"
        class="btn-main w-full bg-slate-900 text-white py-4 text-sm shadow-xl shadow-slate-200 hover:bg-blue-600 active:scale-[0.98] disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none"
        disabled>
        КОНВЕРТИРОВАТЬ
      </button>

      <div id="status-msg" class="hidden mt-3"></div>
    </section>

  </main>

  <script>
    const usedColors = new Set();

    const INTERVALS = {
      distance: [
        { label: "50м", val: 50 },
        { label: "100м", val: 100 },
        { label: "500м", val: 500 },
        { label: "1км", val: 1000 }
      ],
      time: [
        { label: "10с", val: 10 },
        { label: "30с", val: 30 },
        { label: "1м", val: 60 },
        { label: "5м", val: 300 }
      ]
    };

    const state = {
      files: [],
      format: "kml",
      intervalMode: "none",
      intervalValue: null,
      results: []
    };

    const dropZone = document.getElementById("drop-zone");
    const fileInput = document.getElementById("file-input");
    const fileList = document.getElementById("file-list");
    const fileCount = document.getElementById("file-count");
    const clearFilesBtn = document.getElementById("clear-files");

    const kmlSettings = document.getElementById("kml-settings");
    const intervalBlock = document.getElementById("interval-block");
    const intervalGrid = document.getElementById("interval-grid");

    const convertBtn = document.getElementById("convert-btn");
    const statusMsg = document.getElementById("status-msg");

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = v => v * Math.PI / 180;

      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);

      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon/2) * Math.sin(dLon/2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function formatRelativeTime(seconds) {
      const totalMinutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${totalMinutes.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }

    function formatDistance(meters) {
      if (meters < 1000) return `${Math.floor(meters)}м`;
      return `${(meters/1000).toFixed(2)}км`;
    }

    function generateRandomColor() {
      const hue = Math.random();
      const s = 0.8 + Math.random() * 0.2;
      const v = 0.8 + Math.random() * 0.2;

      const i = Math.floor(hue * 6);
      const f = hue * 6 - i;
      const p = v * (1 - s);
      const q = v * (1 - f * s);
      const t = v * (1 - (1 - f) * s);

      let r,g,b;
      switch (i % 6) {
        case 0: r=v; g=t; b=p; break;
        case 1: r=q; g=v; b=p; break;
        case 2: r=p; g=v; b=t; break;
        case 3: r=p; g=q; b=v; break;
        case 4: r=t; g=p; b=v; break;
        case 5: r=v; g=p; b=q; break;
      }

      const toHex = x => Math.floor(x * 255).toString(16).padStart(2, "0");
      return `ff${toHex(b)}${toHex(g)}${toHex(r)}`;
    }

    function getRandomColor() {
      if (usedColors.size > 1000) usedColors.clear();
      while (true) {
        const c = generateRandomColor();
        if (!usedColors.has(c)) {
          usedColors.add(c);
          return c;
        }
      }
    }

    function clearStatus() {
      statusMsg.classList.add("hidden");
      statusMsg.innerHTML = "";
    }

    function showError(text) {
      statusMsg.classList.remove("hidden");
      statusMsg.innerHTML = `
        <div class="toast bg-red-600 text-white shadow-red-200">${text}</div>
      `;
    }

    function cleanupResults() {
      state.results.forEach(r => {
        try { URL.revokeObjectURL(r.url); } catch(e) {}
      });
      state.results = [];
    }

    function createResultFile(content, filename) {
      const blob = new Blob([content], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);

      state.results.push({
        name: filename,
        blob,
        url
      });
    }

    function forceDownload(url, filename) {
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function shareFile(i) {
      try {
        const r = state.results[i];
        const file = new File([r.blob], r.name, { type: "application/octet-stream" });

        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: r.name,
            text: "Track file"
          });
        } else {
          forceDownload(r.url, r.name);
          alert("Поделиться не поддерживается. Файл скачан в загрузки.");
        }
      } catch (e) {
        forceDownload(state.results[i].url, state.results[i].name);
      }
    }

    function renderResults() {
      if (!state.results.length) return;

      statusMsg.classList.remove("hidden");

      const items = state.results.map((r, idx) => `
        <div class="flex items-center justify-between gap-2 bg-white/10 rounded-xl px-3 py-2">
          <div class="truncate text-xs font-black">${r.name}</div>
          <div class="flex gap-2 shrink-0">
            <button class="mini-btn bg-blue-500 text-white hover:bg-blue-400"
              onclick="shareFile(${idx})">
              Поделиться
            </button>
            <button class="mini-btn bg-white/20 text-white hover:bg-white/30"
              onclick="forceDownload('${r.url}', '${r.name.replace(/'/g,"") }')">
              Скачать
            </button>
          </div>
        </div>
      `).join("");

      statusMsg.innerHTML = `
        <div class="toast bg-slate-900 text-white">
          <div class="flex items-center justify-between mb-2">
            <div class="font-black">Готово: ${state.results.length}</div>
            <button class="mini-btn bg-white/15 hover:bg-white/25 text-white"
              onclick="downloadAll()">
              Скачать всё
            </button>
          </div>

          <div class="space-y-2 max-h-52 overflow-auto pr-1">
            ${items}
          </div>

          <div class="mt-2 text-[10px] font-black uppercase tracking-widest text-white/60">
            Лучше всего: "Поделиться" → HERE / Google Earth / OsmAnd
          </div>
        </div>
      `;
    }

    function downloadAll() {
      state.results.forEach(r => forceDownload(r.url, r.name));
    }

    window.forceDownload = forceDownload;
    window.downloadAll = downloadAll;
    window.shareFile = shareFile;

    function parsePSV(text) {
      const lines = text.split(/\r?\n/);
      const points = [];

      for (const line of lines) {
        const parts = line.trim().split("\t");
        if (parts.length < 4) continue;

        const ts = parseFloat(parts[0]);
        const lat = parseFloat(parts[1]);
        const lon = parseFloat(parts[2]);
        const ele = parseFloat(parts[3]);

        if (isNaN(ts) || isNaN(lat) || isNaN(lon) || isNaN(ele)) continue;
        points.push({ ts, lat, lon, ele });
      }

      return points;
    }

    function convertToGPX(points, name) {
      let gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="PSV to GPX Converter"
  xmlns="http://www.topografix.com/GPX/1/1"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
  xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <trk>
    <name>${name}</name>
    <trkseg>`;

      for (const p of points) {
        const dateISO = new Date(p.ts * 1000).toISOString();
        gpx += `
      <trkpt lat="${p.lat}" lon="${p.lon}">
        <ele>${p.ele}</ele>
        <time>${dateISO}</time>
      </trkpt>`;
      }

      gpx += `
    </trkseg>
  </trk>
</gpx>
`;

      return gpx;
    }

    function createKML(points, name, timeInterval=null, distanceInterval=null) {
      let placemarks = [];
      let trackCoords = [];

      let startTime = null;
      let lastMarkTime = null;
      let lastPoint = null;

      let totalDistance = 0;
      let distanceFromMark = 0;

      let lastPointData = null;

      for (const p of points) {
        const { ts, lat, lon, ele } = p;

        trackCoords.push(`${lon},${lat},${ele}`);
        lastPointData = p;

        if (startTime === null) {
          startTime = ts;
          lastMarkTime = ts;
          lastPoint = { lat, lon };

          placemarks.push(`
    <Placemark>
      <name>00:00 (0м)</name>
      <Point>
        <coordinates>${lon},${lat},${ele}</coordinates>
      </Point>
    </Placemark>`);
          continue;
        }

        if (lastPoint) {
          const stepDist = calculateDistance(lastPoint.lat, lastPoint.lon, lat, lon);
          totalDistance += stepDist;
          distanceFromMark += stepDist;
        }

        lastPoint = { lat, lon };

        let addMark = false;
        if (timeInterval !== null && (ts - lastMarkTime >= timeInterval)) addMark = true;
        if (distanceInterval !== null && (distanceFromMark >= distanceInterval)) addMark = true;

        if (addMark) {
          const relSeconds = ts - startTime;
          const timeStr = formatRelativeTime(relSeconds);
          const distStr = formatDistance(totalDistance);

          placemarks.push(`
    <Placemark>
      <name>${timeStr} (${distStr})</name>
      <Point>
        <coordinates>${lon},${lat},${ele}</coordinates>
      </Point>
    </Placemark>`);

          lastMarkTime = ts;
          distanceFromMark = 0;
        }
      }

      if (lastPointData && lastMarkTime !== null && lastPointData.ts !== lastMarkTime) {
        const relSeconds = lastPointData.ts - startTime;
        const timeStr = formatRelativeTime(relSeconds);
        const distStr = formatDistance(totalDistance);

        placemarks.push(`
    <Placemark>
      <name>${timeStr} (${distStr})</name>
      <Point>
        <coordinates>${lastPointData.lon},${lastPointData.lat},${lastPointData.ele}</coordinates>
      </Point>
    </Placemark>`);
      }

      const trackColor = getRandomColor();

      const folderContent = placemarks.length ? `
    <Folder>
      <name>Временные метки</name>
      ${placemarks.join("")}
    </Folder>` : "";

      return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>${name}</name>

    <Style id="trackStyle">
      <LineStyle>
        <color>${trackColor}</color>
        <width>4</width>
      </LineStyle>
      <PolyStyle>
        <color>${trackColor}</color>
      </PolyStyle>
    </Style>

    <Placemark>
      <name>${name}</name>
      <styleUrl>#trackStyle</styleUrl>
      <LineString>
        <extrude>1</extrude>
        <tessellate>1</tessellate>
        <altitudeMode>absolute</altitudeMode>
        <coordinates>${trackCoords.join(" ")}</coordinates>
      </LineString>
    </Placemark>

    ${folderContent}

  </Document>
</kml>
`;
    }

    function updateUI() {
      fileCount.textContent = state.files.length;

      if (state.files.length) {
        fileList.classList.remove("hidden");
        clearFilesBtn.classList.remove("hidden");
      } else {
        fileList.classList.add("hidden");
        clearFilesBtn.classList.add("hidden");
      }

      if (state.format === "gpx") {
        kmlSettings.classList.add("hidden");
      } else {
        kmlSettings.classList.remove("hidden");
      }

      const readyKML = state.format === "kml" && (state.intervalMode === "none" || state.intervalValue !== null);
      const readyGPX = state.format === "gpx";

      convertBtn.disabled = !(state.files.length && (readyKML || readyGPX));
      clearStatus();
    }

    function renderFileList() {
      if (!state.files.length) {
        fileList.innerHTML = "";
        return;
      }

      fileList.innerHTML = `
        <div class="bg-slate-50 rounded-2xl p-3 border border-slate-200">
          <div class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">
            Загружено: ${state.files.length}
          </div>
          <div class="space-y-1 max-h-28 overflow-auto pr-1">
            ${state.files.map(f => `
              <div class="flex items-center justify-between text-xs font-bold text-slate-700">
                <span class="truncate max-w-[85%]">${f.name}</span>
                <span class="text-slate-400">${Math.round(f.size/1024)}kb</span>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderIntervals() {
      intervalGrid.innerHTML = "";

      if (state.intervalMode === "none") {
        intervalBlock.classList.add("hidden");
        return;
      }

      intervalBlock.classList.remove("hidden");

      INTERVALS[state.intervalMode].forEach(item => {
        const btn = document.createElement("button");
        btn.textContent = item.label;

        btn.className = `
          py-2.5 rounded-2xl font-black text-xs border border-slate-200 bg-white text-slate-600
          shadow-sm transition-all hover:bg-blue-50 hover:border-blue-300 active:scale-95
        `;

        btn.onclick = () => {
          intervalGrid.querySelectorAll("button").forEach(b => {
            b.classList.remove("bg-blue-600","text-white","border-blue-600","shadow-lg");
            b.classList.add("bg-white","text-slate-600","border-slate-200");
          });

          btn.classList.remove("bg-white","text-slate-600","border-slate-200");
          btn.classList.add("bg-blue-600","text-white","border-blue-600","shadow-lg");

          state.intervalValue = item.val;
          updateUI();
        };

        intervalGrid.appendChild(btn);
      });
    }

    function addFiles(files) {
      const arr = Array.from(files || []);
      if (!arr.length) return;

      state.files.push(...arr);
      renderFileList();
      updateUI();
    }

    function clearFiles() {
      state.files = [];
      fileInput.value = "";
      renderFileList();
      updateUI();
    }

    dropZone.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", (e) => {
      addFiles(e.target.files);
    });

    clearFilesBtn.addEventListener("click", (e) => {
      e.preventDefault();
      clearFiles();
    });

    let dragCounter = 0;

    dropZone.addEventListener("dragenter", (e) => {
      e.preventDefault();
      dragCounter++;
      dropZone.classList.add("drag-over");
    });

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
    });

    dropZone.addEventListener("dragleave", (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dropZone.classList.remove("drag-over");
        dragCounter = 0;
      }
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dragCounter = 0;
      dropZone.classList.remove("drag-over");

      const files = e.dataTransfer.files;
      addFiles(files);
    });

    document.querySelectorAll('[data-type="format"]').forEach(card => {
      card.addEventListener("click", () => {
        document.querySelectorAll('[data-type="format"]').forEach(c => c.classList.remove("active"));
        card.classList.add("active");

        state.format = card.dataset.value;
        updateUI();
      });
    });

    document.querySelectorAll('[data-type="interval-mode"]').forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll('[data-type="interval-mode"]').forEach(b => {
          b.classList.remove("active");
          b.classList.add("inactive");
        });

        btn.classList.remove("inactive");
        btn.classList.add("active");

        state.intervalMode = btn.dataset.value;
        state.intervalValue = null;

        renderIntervals();
        updateUI();
      });
    });

    async function runConversion() {
      try {
        clearStatus();
        cleanupResults();

        if (!state.files.length) {
          showError("Файлы не выбраны");
          return;
        }

        if (state.format === "kml" && state.intervalMode !== "none" && state.intervalValue === null) {
          showError("Выберите интервал");
          return;
        }

        let okCount = 0;
        let errCount = 0;

        for (const file of state.files) {
          try {
            const text = await file.text();
            const points = parsePSV(text);

            if (!points.length) {
              errCount++;
              continue;
            }

            const baseName = file.name.replace(/\.[^/.]+$/, "");

            if (state.format === "gpx") {
              const gpx = convertToGPX(points, baseName);
              createResultFile(gpx, `${baseName}.gpx`);
              okCount++;
              continue;
            }

            let timeInterval = null;
            let distanceInterval = null;
            let suffix = "";

            if (state.intervalMode === "time") {
              timeInterval = state.intervalValue;
              suffix = `_метки_${state.intervalValue}сек`;
            } else if (state.intervalMode === "distance") {
              distanceInterval = state.intervalValue;
              suffix = `_метки_${state.intervalValue}м`;
            }

            const kml = createKML(points, baseName, timeInterval, distanceInterval);
            createResultFile(kml, `${baseName}${suffix}.kml`);
            okCount++;

          } catch (e) {
            errCount++;
          }
        }

        if (!okCount) {
          showError("Ошибка: файлы не распознаны");
          return;
        }

        renderResults();

      } catch (e) {
        console.error(e);
        showError("Ошибка конвертации");
      }
    }

    convertBtn.addEventListener("click", runConversion);

    renderIntervals();
    updateUI();
  </script>

</body>
</html>
